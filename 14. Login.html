<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<body>
    <form action="15. StudentForm.html"  align="center" width="400px" height="500px">

      <fieldset width="400px" height="500px" >
        <legend align="left">LOGIN</legend>
        <br><br>

        <label for="username">User name : </label>
        <input type="text" placeholder="Enter User Name" required id="username"><br><br>

        <label for="password">Password : </label>
        <input type="text" placeholder="Enter Password" required id="password"><br><br>

        <button type="submit">Login</button>
        <button type="reset">Cancel</button><br><br>

        <a>Forget Password ?</a>
        <a href="forgot-password.html"> Click here</a>
        <br><br>

      </fieldset> 


    </form>
</body>
</html>
