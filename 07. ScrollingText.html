<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1><marquee behavior="scroll" 
        direction="right" scrollamount="20" 
        bgcolor="lime" height="100px" vspace="80px"
        hspace="80px">Kapil Sharma</marquee></h1>
    
        <h1><marquee behavior="alternate" 
        direction="left" scrollamount="20" 
        bgcolor="lime" height="100px" vspace="80px"
        hspace="80px">Kapil Sharma</marquee></h1>

         <h1><marquee behavior="scroll" 
        direction="up" scrollamount="20" 
        bgcolor="lime" height="100px" vspace="80px"
        hspace="80px">Kapil Sharma</marquee></h1>
    
        <h1><marquee behavior="alternate" 
        direction="down" scrollamount="20" 
        bgcolor="lime" height="100px" vspace="80px"
        hspace="80px">Kapil Sharma</marquee></h1>


</body>
</html>
